name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      db:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge_dev_password
          POSTGRES_DB: microcourse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forge -d microcourse"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - uses: actions/cache@v6
        with:
          path: apps/api/.cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - run: uv run pytest
