name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      db:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge_dev_password
          POSTGRES_DB: microcourse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forge -d microcourse"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/api/.cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - run: uv run pytest
      - run: uv run python -m forge.report --check

      # The book isn't in the repo; fetch the exact copy the eval labels were written against.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/raw/psychology-2e.pdf
          key: psychology-2e-2f08113c
      - name: Download the corpus
        working-directory: .
        run: |
          [ -f data/raw/psychology-2e.pdf ] || curl -sSfL -o data/raw/psychology-2e.pdf \
            https://assets.openstax.org/oscms-prodcms/media/documents/Psychology2e_WEB.pdf
          echo "2f08113c78127bc684922ad6a819db22bd4705ce9fcf28a07f36a2041b1474e2  data/raw/psychology-2e.pdf" \
            | sha256sum -c
      - run: uv run python -m forge.ingest
      - run: uv run python -m forge.evals retrieval --mode rerank --check

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check .
      - run: npm run typecheck
      - run: npm run build

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
