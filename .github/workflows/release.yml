name: Release

# On every push to main: build both images and push them to GHCR, tagged with the commit.
# Deploying to Azure runs only once the repository variable AZURE_CLIENT_ID exists (see
# infra/terraform/README.md), and waits for approval in the "production" environment.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write # for Azure OIDC login

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: apps/${{ matrix.app }}
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/microcourse-forge-${{ matrix.app }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/microcourse-forge-${{ matrix.app }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: images
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infra/terraform
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_api_image: ghcr.io/${{ github.repository_owner }}/microcourse-forge-api:${{ github.sha }}
      TF_VAR_web_image: ghcr.io/${{ github.repository_owner }}/microcourse-forge-web:${{ github.sha }}
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
      TF_VAR_budget_start_date: ${{ vars.BUDGET_START_DATE }}
      TF_VAR_anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.6
      - run: >-
          terraform init -input=false
          -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=tfstate"
          -backend-config="key=microcourse-forge.tfstate"
          -backend-config="use_azuread_auth=true"
          -backend-config="use_oidc=true"
      - run: terraform apply -input=false -auto-approve
      - name: Smoke test
        run: |
          url="$(terraform output -raw web_url)"
          for _ in $(seq 1 30); do curl -sf "$url" >/dev/null && exit 0; sleep 10; done
          echo "web app at $url didn't answer" && exit 1
