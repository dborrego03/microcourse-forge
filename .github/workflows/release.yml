name: Release

# After CI passes on main: build both images and push them to GHCR, tagged with the commit
# CI tested. Deploying to Azure runs only once the repository variable AZURE_CLIENT_ID exists
# (see infra/terraform/README.md), and waits for approval in the "production" environment.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Nothing by default; each job asks for what it needs.
permissions: {}

env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  images:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/${{ matrix.app }}
          push: true
          build-args: GIT_SHA=${{ env.SHA }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/microcourse-forge-${{ matrix.app }}:${{ env.SHA }}
            ghcr.io/${{ github.repository_owner }}/microcourse-forge-${{ matrix.app }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: images
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # Azure OIDC login, only in this approved job
    defaults:
      run:
        working-directory: infra/terraform
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_api_image: ghcr.io/${{ github.repository_owner }}/microcourse-forge-api:${{ github.event.workflow_run.head_sha || github.sha }}
      TF_VAR_web_image: ghcr.io/${{ github.repository_owner }}/microcourse-forge-web:${{ github.event.workflow_run.head_sha || github.sha }}
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
      TF_VAR_budget_start_date: ${{ vars.BUDGET_START_DATE }}
      TF_VAR_anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
      - run: >-
          terraform init -input=false
          -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=tfstate"
          -backend-config="key=microcourse-forge.tfstate"
          -backend-config="use_azuread_auth=true"
          -backend-config="use_oidc=true"
      - run: terraform apply -input=false -auto-approve
      - name: Smoke test
        run: |
          url="$(terraform output -raw web_url)"
          for _ in $(seq 1 30); do curl -sf "$url" >/dev/null && exit 0; sleep 10; done
          echo "web app at $url didn't answer" && exit 1
