name: Nightly evals

# The full set: retrieval (no model calls), guardrails and generation (both call Claude).
# The model calls run through the Claude Code CLI with a token from `claude setup-token`,
# stored as the CLAUDE_CODE_OAUTH_TOKEN secret. Without it only retrieval runs.

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/api
    env:
      # Only whether the token exists; the token itself goes to the three steps that use it.
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      FORGE_LLM_CACHE: "off"
    services:
      db:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge_dev_password
          POSTGRES_DB: microcourse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forge -d microcourse"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/api/.cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - run: uv sync --locked
      - run: uv run alembic upgrade head
      - run: uv run python -m forge.ingest --url https://assets.openstax.org/oscms-prodcms/media/documents/Psychology2e_WEB.pdf

      - run: uv run python -m forge.evals retrieval --mode rerank --check

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.HAS_TOKEN == 'true'
        with:
          node-version: 24
      - if: env.HAS_TOKEN == 'true'
        run: npm install -g @anthropic-ai/claude-code@2.1.301
      - if: env.HAS_TOKEN == 'true'
        run: uv run python -m forge.evals guardrails --dataset redteam_v1 --check
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - if: env.HAS_TOKEN == 'true'
        run: uv run python -m forge.evals guardrails --dataset redteam_holdout
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - if: env.HAS_TOKEN == 'true'
        run: uv run python -m forge.evals generation --check
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: eval-results
          path: evals/results/
