services:
  db:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge_dev_password
      POSTGRES_DB: microcourse
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d microcourse"]
      interval: 5s
      retries: 10

  # The whole app in containers: docker compose --profile app up -d --build
  # Generating lessons needs the Claude CLI or an API key (docs/adr/0002-llm-provider.md), so in
  # containers you can browse, search, export and narrate lessons, but not create new ones.
  migrate:
    build: apps/api
    profiles: [app]
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql://forge:forge_dev_password@db:5432/microcourse
    depends_on:
      db:
        condition: service_healthy

  api:
    build: apps/api
    profiles: [app]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://forge:forge_dev_password@db:5432/microcourse
    volumes:
      - media:/data/media
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build: apps/web
    profiles: [app]
    environment:
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

  # Local trace viewer: docker compose --profile tracing up -d, then open http://localhost:16686
  # and run the API with OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    profiles: [tracing]
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"

volumes:
  pgdata:
  media:
