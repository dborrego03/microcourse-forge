[project]
name = "forge"
version = "0.1.0"
description = "Ingestion, retrieval and lesson generation for microcourse-forge"
requires-python = ">=3.12"
dependencies = [
    "pypdf",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
